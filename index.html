<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>My TicToc Game</title>
    <link rel="stylesheet" href="style.css" />
  </head>
  <body>
    <main>
      <h1>TicToc Game</h1>
      <div class="container">
        <div class="game">
          <button id="btn1" class="btn" tag="0"></button>
          <button id="btn2" class="btn" tag="1"></button>
          <button id="btn3" class="btn" tag="2"></button>
          <button id="btn4" class="btn" tag="3"></button>
          <button id="btn5" class="btn" tag="4"></button>
          <button id="btn6" class="btn" tag="5"></button>
          <button id="btn7" class="btn" tag="6"></button>
          <button id="btn8" class="btn" tag="7"></button>
          <button id="btn9" class="btn" tag="8"></button>
        </div>
      </div>
      <div>
        <button id="reset-btn">Reset</button>
      </div>
    </main>
    <script src="script.js"></script>
  </body>
</html>
